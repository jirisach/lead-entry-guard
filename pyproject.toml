[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-entry-guard"
version = "4.0.0"
description = "Real-time ingestion gateway for CRM and marketing pipelines"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.4",
    "pybloom-live>=4.0.0",
    "hvac>=2.1.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "phonenumbers>=8.13.0",
    "email-validator>=2.1.0",
    "statsd>=4.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    # Phase 3A — tenant store
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
    "asgi-lifespan>=2.1.0",
]
benchmark = [
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (full app lifecycle, DB, lifespan). Excluded from fast profile.",
    "contract: marks tests as contract/phase-gate tests. No heavy dependencies — runs in fast and full profiles.",
]
# Three run profiles:
#   fast        pytest -q -m "not integration"   — unit + contract, no lifespan overhead
#   integration pytest -q -m "integration"       — integration tests only
#   full        pytest -q                         — everything, use before merge/release
#
# Note: contract tests are NOT in the integration profile — they have no
# integration marker. Contract tests run in fast and full only.
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
