name: Lead Entry Guard CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches: [main]

jobs:

  # ── Fast profile — runs on every push to tracked branches ──────────────────
  #
  # Unit + contract tests. No app lifecycle, no DB, no lifespan overhead.
  # Should complete in seconds. Fails fast on signal layer regressions.
  #
  # Phase gate: test_signal_check_parity.py (contract marker) is included here.
  # If parity fails, the push is blocked before integration even runs.

  fast:
    name: Fast (unit + contract)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run fast profile
        run: pytest -q -m "not integration"
        env:
          LEG_ENVIRONMENT: development
          LEG_TRUSTED_PROXY_IPS: ""
          LEG_SIGNAL_CHECK_WORKERS: "1"


  # ── Integration profile — runs on PRs and direct pushes to main ────────────
  #
  # Full app lifecycle tests: DB (SQLite in-memory), lifespan, shutdown hooks.
  # Runs after fast succeeds (needs: fast) so integration never runs when
  # unit/contract tests are already broken.
  #
  # Runs on:
  #   - pull_request → catches issues before merge
  #   - push to main → catches direct pushes that bypass PR (safety net)

  integration:
    name: Integration (app lifecycle)
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration profile
        run: pytest -q -m "integration"
        env:
          LEG_ENVIRONMENT: development
          LEG_TRUSTED_PROXY_IPS: ""
          LEG_SIGNAL_CHECK_WORKERS: "1"
