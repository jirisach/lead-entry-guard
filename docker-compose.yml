version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LEG_REDIS_URL: redis://redis:6379/0
      LEG_VAULT_URL: http://vault:8200
      LEG_VAULT_TOKEN: dev-root-token
      LEG_ENVIRONMENT: development
      LEG_DEBUG: "true"
      LEG_STATSD_HOST: statsd
      LEG_STATSD_PORT: "8125"
      LEG_DATABASE_URL: postgresql+asyncpg://leg:leg@postgres:5432/leg
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leg
      POSTGRES_PASSWORD: leg
      POSTGRES_DB: leg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leg -d leg"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.16
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  statsd:
    image: graphiteapp/graphite-statsd:latest
    ports:
      - "8125:8125/udp"
      - "8080:80"

volumes:
  postgres_data:
